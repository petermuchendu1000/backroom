# Ongero coturn (TURN/STUN) Configuration
# Documentation: https://github.com/coturn/coturn/wiki/turnserver

# ============================================
# NETWORK
# ============================================

# STUN/TURN listener port
listening-port=3478

# TLS listener port (for TURNS)
#
# This port only works if a certificate and key are supplied. coturn is explicit
# about it when they are missing:
#
#   ERROR tls-listening-port 5349 is configured, but the TLS and DTLS listeners
#   are disabled. The server will NOT listen on that port. Set valid 'cert' and
#   'pkey' files (readable by the turnserver process) to enable TLS/DTLS.
#
# "readable by the turnserver process" is the part that catches people. coturn
# runs as nobody (uid 65534), and Caddy writes its certificates root-owned mode
# 600 inside directories mode 700 — so mounting Caddy's volume in here directly
# leaves the files present and unreadable.
#
# cert= and pkey= are therefore NOT set in this file. deploy/coturn-entrypoint.sh
# passes them on the command line after confirming the pair is readable, and
# restarts turnserver when the certificate is renewed (coturn has no reload).
# deploy/cert-sync.sh is what re-owns the pair so it can be read at all.
tls-listening-port=5349

# Alternative port (some networks block 3478)
alt-listening-port=3479

# Relay ports range (UDP)
min-port=49152
max-port=65535

# External IP (REQUIRED for production - set via env or replace)
# For Docker, this should be the host's public IP
# external-ip=YOUR_PUBLIC_IP

# Realm (domain name for authentication)
realm=ongero.com

# ============================================
# AUTHENTICATION
# ============================================

# Short-lived credentials only ("TURN REST API" mode).
#
# A username is "<unix-expiry>:<account-id>" and the password is the base64 HMAC-SHA1
# of that username under the shared secret. coturn recomputes the HMAC, so it stores
# no credentials and every one expires by itself.
#
# There used to be a `lt-cred-mech` plus a static `user=backroom:...` here as well.
# Verified against coturn 4.6.1: with use-auth-secret enabled, static user entries are
# ignored entirely, so that line was not a fallback — it was dead configuration that
# made the setup look like it supported a credential coturn would always reject.
use-auth-secret

# The secret is NOT in this file on purpose.
#
# A value committed here is published, and a published TURN secret is an open relay:
# anyone can mint their own credentials and use the server to move their traffic, on
# your bandwidth. Supply it at startup instead, identical to TURN_STATIC_AUTH_SECRET
# given to the REST API and the signalling service:
#
#     turnserver -c turnserver.conf --static-auth-secret="$TURN_STATIC_AUTH_SECRET"
#
# docker-compose does this. With no secret, coturn refuses every allocation, which is
# the right way to fail.

# ============================================
# SECURITY
# ============================================

# Fingerprint for messages
fingerprint

# Weak TLS versions.
#
# There used to be three lines here — no-sslv3, no-tlsv1 and no-tlsv1_1 —
# intended to disable them. coturn 4.19.2 does not recognise any of the three.
# It rejected each one at startup:
#
#   WARNING Bad configuration format: no-sslv3
#   WARNING Bad configuration format: no-tlsv1
#   WARNING Bad configuration format: no-tlsv1_1
#
# Nobody saw those warnings, because no-stdout-log (see LOGGING below) kept them
# out of `docker logs`. So this section had looked like it was hardening TLS
# while doing nothing at all, for as long as it has existed.
#
# They are also unnecessary. This build reports only:
#
#   INFO TLS 1.2 supported / INFO TLS 1.3 supported / INFO DTLS 1.2 supported
#
# TLS 1.2 is already the minimum and the weak versions are not compiled in. The
# options this version accepts only LOWER the floor (--tlsv1, --tlsv1_1) or
# raise it to TLS 1.3 only (--no-tlsv1_2). Do not set --no-tlsv1_2: it would cut
# off older Android clients for no gain.

# Deny specific IP ranges from being relayed to (security)
# Prevents relaying to private networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ============================================
# PERFORMANCE
# ============================================

# Number of relay threads (0 = auto based on CPU cores)
relay-threads=0

# Max allocations per user
user-quota=12

# Total allocation quota
total-quota=1200

# ============================================
# LOGGING
# ============================================

# This block previously read:
#
#     verbose                 # "disable in production for performance"
#     # log-file=...          # "Docker will use stdout"  — commented out
#     no-stdout-log           # "Don't log sessions (privacy)"
#
# Each line did something other than what its comment claimed, and together they
# produced the worst of both outcomes: every session detail recorded, and none of
# it visible to whoever runs the server.
#
#   - `verbose` was LEFT ON, despite the comment saying to disable it.
#   - `no-stdout-log` does not mean "don't log sessions". coturn documents it as:
#     "By default, all log messages are going to both stdout and to a log file.
#     With this option everything will be going to the log file only." So it does
#     not reduce what is logged by one line — it only hides it.
#   - The log file was never configured, so coturn fell back to its search path
#     and wrote to /var/tmp/turn_<pid>_<date>.log INSIDE the container: deleted
#     with the container, and absent from `docker logs` entirely.
#
# Measured: `docker logs` returned 0 lines while that file had grown to 7.4 KB
# within three idle seconds. The startup errors explaining why TURNS was dead,
# and the warnings that three TLS directives were being rejected, were all in
# there, unread.
#
# What replaces it:

# Send everything to stdout, so `docker compose logs coturn` works and the
# platform owns retention and rotation. "stdout" is a documented special name.
log-file=stdout

# No PID/date in the filename. Irrelevant for stdout, but it stops coturn
# constructing a rolled filename if log-file is ever pointed at a real path.
simple-log

# THIS is the privacy control, and the one the old comment was reaching for.
# coturn's default minimum level is `debug` — i.e. everything, including
# per-session lines carrying client IP addresses. For a service where who called
# is itself sensitive, that is not something to keep by default.
#
# At `warning` we keep what an operator needs — failures to bind, certificate
# problems, rejected configuration, quota exhaustion — and stop recording who
# connected and from where. Raise to `info` temporarily when debugging a relay
# problem, and put it back afterwards.
log-min-level=warning

# Note: STUN binding requests are already not logged. coturn 4.19.2 documents
# --log-binding as "now disabled by default to avoid DoS attacks", so that needs
# no line here; just do not add one.

# ============================================
# MISC
# ============================================

# Process user (for non-Docker deployments)
# proc-user=turnserver
# proc-group=turnserver

# Mobility (for mobile clients that change IPs)
mobility

# Enable STUN only (no TURN relay) - useful for testing
# stun-only

# Server name
server-name=ongero-turn

# CLI for admin (optional, disabled by default)
# cli-ip=127.0.0.1
# cli-port=5766
# cli-password=admin

