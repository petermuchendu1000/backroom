# Ongero — Development Docker Compose
# Start with: docker-compose up -d
# Requires: Docker, Docker Compose


services:
  # ============================================
  # POSTGRES — Primary database
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: ongero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-backroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-backroom_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-backroom}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Numbered so Postgres runs them in order: it executes the files in
      # docker-entrypoint-initdb.d alphabetically, and payments references users.
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./backend/migrations/002_mpesa_payments.sql:/docker-entrypoint-initdb.d/02-mpesa-payments.sql:ro
      - ./backend/migrations/003_payment_gateways.sql:/docker-entrypoint-initdb.d/03-payment-gateways.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-backroom} -d ${POSTGRES_DB:-backroom}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # REDIS — Cache, queues, presence, pub/sub
  # ============================================
  # REDIS — Cache, queues, presence, pub/sub
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ongero-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # COTURN — TURN/STUN server for WebRTC
  # ============================================
  coturn:
    # Pinned by digest, not :latest.
    #
    # This is an OCI image index (multi-arch), so it resolves on any
    # architecture — verified: mediaType application/vnd.oci.image.index.v1+json.
    # It is coturn 4.19.2.
    #
    # Pinned because this stack's configuration is version-sensitive in ways that
    # fail quietly. coturn 4.19.2 REJECTS directives that older versions accepted
    # (no-sslv3, no-tlsv1, no-tlsv1_1 were silently discarded here for a long
    # time), and deploy/coturn-entrypoint.sh depends on there being no
    # certificate reload. An unpinned tag means a rebuild can change TURN
    # behaviour with no diff and no signal.
    #
    # It is pinned in the DEV file on purpose, so development and production run
    # the same TURN server. turnserver.conf is shared between them, and debugging
    # a relay problem against a different coturn than production runs is how you
    # reach a confident wrong answer.
    #
    # To update: pull the new tag, read the digest, change it in BOTH places
    # (here and the cert-sync service in docker-compose.prod.yml), then re-run
    # ./deploy/verify.sh — it asserts the two match.
    #
    #   docker pull coturn/coturn:latest
    #   docker image inspect coturn/coturn:latest --format '{{index .RepoDigests 0}}'
    #
    image: coturn/coturn@sha256:ccdbc51e6f072130b0fc9eebda21f8d026d0a25581746c52557e887818011a3f
    container_name: ongero-coturn
    restart: unless-stopped
    ports:
      # STUN/TURN
      - "3478:3478"
      - "3478:3478/udp"
      # Alternative port
      - "3479:3479"
      - "3479:3479/udp"
      # TURNS (TLS)
      - "5349:5349"
      - "5349:5349/udp"
      # Relay ports (UDP range for media)
      - "49152-49252:49152-49252/udp"
    volumes:
      - ./backend/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # The secret is passed in rather than committed to turnserver.conf. ":?" makes
    # compose refuse to start with a readable message when it is unset, instead of
    # falling back to a default that, being in a public repository, would be an open
    # relay for anyone who reads it.
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--static-auth-secret=${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET in .env — generate one with: openssl rand -hex 32}"
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    healthcheck:
      test: ["CMD", "turnadmin", "-l"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # REST API — NestJS backend
  # ============================================
  rest-api:
    build:
      context: ./backend/rest-api
      dockerfile: Dockerfile
    container_name: ongero-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-backroom}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-backroom_dev_password}
      - POSTGRES_DB=${POSTGRES_DB:-backroom}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_me_in_production}
      - TURN_URL=turn:coturn:3478
      - STUN_URL=stun:coturn:3478
      - TURN_STATIC_AUTH_SECRET=${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET in .env}
      - MPESA_ENVIRONMENT=${MPESA_ENVIRONMENT:-sandbox}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY:-}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET:-}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE:-}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_CALLBACK_URL=${MPESA_CALLBACK_URL:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # WS-SIGNALING — Go WebSocket server
  # ============================================
  ws-signaling:
    build:
      context: ./backend/ws-signaling
      dockerfile: Dockerfile
    container_name: ongero-ws-signaling
    restart: unless-stopped
    depends_on:
      - coturn
      - redis
    environment:
      - WS_PORT=8443
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_me_in_production}
      # Use external IP for TURN so phones can connect (not Docker internal hostname)
      - TURN_URL=${TURN_URL:-turn:192.168.1.160:3478}
      - TURN_STATIC_AUTH_SECRET=${TURN_STATIC_AUTH_SECRET:?set TURN_STATIC_AUTH_SECRET in .env}
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: ongero-network

