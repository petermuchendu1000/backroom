# Cloudflare Pages project for the Ongero marketing site.
#
# LIVE at https://ongero.com and https://www.ongero.com
#
# The site is a static export (see next.config.ts), so Pages serves plain files from
# its edge: no Workers runtime, no Next.js adapter to keep in step with releases, and
# nothing that can fail at request time.
#
# ---------------------------------------------------------------------------------
# Where it lives
# ---------------------------------------------------------------------------------
#
#   project    ongero            ongero-dc6.pages.dev
#   account    2085de7e8387e3898880124890f63826   (Mitasafi89@gmail.com's Account)
#   zone       ongero.com, active, on Cloudflare nameservers
#
# ongero.com and www.ongero.com are proxied CNAMEs to ongero-dc6.pages.dev. They
# replaced a Namecheap parking page.
#
# DO NOT touch the zone's MX or TXT records. Five MX entries point at Namecheap email
# forwarding and the TXT is its SPF record; they are live mail, not site config, and a
# deploy has no business changing them.
#
# ---------------------------------------------------------------------------------
# Deploying
# ---------------------------------------------------------------------------------
#
#     cd website
#     npm ci && npx next build
#     CLOUDFLARE_ACCOUNT_ID=... CLOUDFLARE_API_TOKEN=... \
#       npx wrangler pages deploy out --project-name=ongero
#
# The token needs "Cloudflare Pages: Edit" on the account.
#
# Worth doing once: connect the project to this GitHub repository in the dashboard
# (build `npx next build`, output `website/out`, root `website`). Every push then
# deploys and every pull request gets a preview. It needs a GitHub OAuth grant, which
# no API token can perform.
#
# ---------------------------------------------------------------------------------
# Deploying from a Claude Code cloud session
# ---------------------------------------------------------------------------------
#
# Works, but ONLY with no api.cloudflare.com entry in the session environment's
# network secrets.
#
# With one present the session proxy REPLACES the Authorization header on every
# request to that host. Measured: a deliberately invalid token still returned 200 with
# the real account. Pages uses two different bearers against that one host — the
# account API token for project endpoints, and a short-lived JWT from
# .../pages/projects/{name}/upload-token for the asset blobs — so the JWT was being
# swapped out and the upload refused with 403 / 8000013. Neither the token nor its
# scopes were ever at fault, despite three of my own reports saying otherwise.
#
# Remove that secret and the header passes through; wrangler then behaves normally.

name = "ongero"
pages_build_output_dir = "out"
compatibility_date = "2026-11-26"
